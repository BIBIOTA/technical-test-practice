services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview_practice_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_practice_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build: ./backend
    env_file: .env.test
    environment:
      DATABASE_URL: postgresql+asyncpg://interview:interview@postgres-test:5432/interview_practice_test
      INTERVIEW_TOKEN: test-token
    ports:
      - "8001:8000"
    depends_on:
      postgres-test:
        condition: service_healthy

  frontend-test:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "3001:3000"
    depends_on:
      - backend-test

volumes:
  pgdata-test:
