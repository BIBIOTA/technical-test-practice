[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interview-e2e-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["tests"]
